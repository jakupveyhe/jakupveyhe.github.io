<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <meta name="description" content="A temporary homepage.">
    <title>Temporary homepage</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #242424;
        background: #f5f4f0;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      main {
        max-width: 32rem;
        text-align: center;
      }

      p {
        color: #66645e;
        line-height: 1.6;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4rem);
        letter-spacing: -0.06em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Temporary homepage</h1>
      <p>This site is a work in progress. Please check back soon.</p>
    </main>
  </body>
</html>
